[package]
name = "hematite-cli"
description = "CLI binary for Hematite skin fixer"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "hematite-cli"
path = "src/main.rs"

[dependencies]
hematite-types = { workspace = true }
hematite-core = { workspace = true }
hematite-file = { workspace = true }
hematite-live = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# CLI framework
clap = { version = "4.4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
colored = "2.0"

# Live progress bar (shown in Normal verbosity; suppressed under -v verbose/trace)
indicatif = "0.17"

# File processing
zip = "0.6"
tempfile = "3.10"
walkdir = "2"

# Remote config fetching
reqwest = { version = "0.12", features = ["blocking", "json"] }
const_format = "0.2"

# Semantic version comparison for the force-update gate
semver = "1.0"

# Hash database decompression
zstd = "0.13"


[build-dependencies]
winres = "0.1"

