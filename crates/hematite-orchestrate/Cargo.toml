[package]
name = "hematite-orchestrate"
description = "Folder-level fix orchestration — the extract → detect → fix → recover → rebuild pipeline as a library"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
hematite-types = { workspace = true }
hematite-core = { workspace = true }
hematite-file = { workspace = true }
hematite-live = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
walkdir = "2"
# Config fetching. `remote` lives here rather than in the CLI so every consumer
# (the CLI, Celestial) reads the same fix_config.toml through the same cache,
# instead of each forking its own copy of the fetch-and-fall-back logic.
reqwest = { version = "0.12", features = ["blocking", "json"] }
const_format = "0.2"
# Packed archives are unpacked to a scratch folder so both forms share one code path.
tempfile = "3.10"
toml = "0.8"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = { workspace = true }
tempfile = "3.10"
zstd = "0.13"
indexmap = { workspace = true }
toml = "0.8"
