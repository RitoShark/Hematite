[package]
name = "hematite-file"
description = "File-format adapter — the ONLY crate that imports the RitoShark file crates"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
hematite-types = { workspace = true }
hematite-core = { path = "../hematite-core" }
anyhow = { workspace = true }
indexmap = { workspace = true }

# League file parsing — THIS IS THE ONLY CRATE THAT DEPENDS ON THE RITOSHARK CRATES.
# When the file-format crates break their API, only this crate needs updating.
# Using git versions (pinned rev) to match the project's CI convention.
rs_io = { git = "https://github.com/RitoShark/RitoShark-Crates.git", rev = "9bd8d01" }
rs_bin = { git = "https://github.com/RitoShark/RitoShark-Crates.git", rev = "9bd8d01" }
rs_wad = { git = "https://github.com/RitoShark/RitoShark-Crates.git", rev = "9bd8d01" }
rs_tex = { git = "https://github.com/RitoShark/RitoShark-Crates.git", rev = "9bd8d01" }
rs_mesh = { git = "https://github.com/RitoShark/RitoShark-Crates.git", rev = "9bd8d01" }

# Image type shared with rs_tex's encode/decode API.
image = { version = "0.25", default-features = false }

# Hashing (for WAD path hashing)
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# LMDB database (for hash lookups)
heed = "0.20"
page_size = "0.6"

# Logging
tracing = "0.1"
