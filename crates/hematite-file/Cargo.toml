[package]
name = "hematite-file"
description = "File-format adapters and filesystem providers for Hematite"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true

[dependencies]
hematite-types = { workspace = true }
hematite-core = { path = "../hematite-core" }
anyhow = { workspace = true }
indexmap = { workspace = true }

# File I/O adapters. The generic BIN editor and shared types also depend on rs_bin.
# Using git versions (pinned rev) to match the project's CI convention.
rs_io = { git = "https://github.com/RitoShark/RitoShark-Crates.git", rev = "32da36c" }
rs_bin = { git = "https://github.com/RitoShark/RitoShark-Crates.git", rev = "32da36c" }
rs_wad = { git = "https://github.com/RitoShark/RitoShark-Crates.git", rev = "32da36c" }
rs_tex = { git = "https://github.com/RitoShark/RitoShark-Crates.git", rev = "32da36c" }
rs_audio = { git = "https://github.com/RitoShark/RitoShark-Crates.git", rev = "32da36c" }
rs_mesh = { git = "https://github.com/RitoShark/RitoShark-Crates.git", rev = "32da36c" }

# Image type shared with rs_tex's encode/decode API.
image = { version = "0.25", default-features = false }

# Hashing (for WAD path hashing)
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# LMDB database (for hash lookups)
heed = "0.20"
page_size = "0.6"

# Logging
tracing = "0.1"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3.10"
