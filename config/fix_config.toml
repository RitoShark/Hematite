version = "2.3.5"
last_updated = "2026-09-08"

enabled_fixes = [
    "file_ref_migration",
    "merge_linked_bins",
    "healthbar_fix",
    "staticmat_texturepath",
    "staticmat_samplername",
    "black_icons",
    "dds_to_tex",
    "champion_bin_remover",
    "vfx_shape_fix",
    "shader_fallback",
    "gear_pull",
    "cac_pull",
    "entry_validator",
    "resolve_dead_refs",
    "bnk_remover",
    "dds_texture_converter",
    "sco_mesh_converter",
    "anm_remover",
    "fix_tex_dimensions",
    "combo_bin_relocate",
]

[repath]
enabled = true
prefix = "hematite"
layout = "nested"
invis_texture = true
skip_vo = true
placeholder_rules = [
    { pattern = "(?i)coloroverlifetime|color-hold|colorhold", asset = "colorwhiteplaceholder" },
    { pattern = "(?i)toonshading", asset = "toonshading" },
    { pattern = "(?i)outlinetonemap", asset = "outlinetonemap" },
]

[fixes]

[fixes.file_ref_migration]
name = "Asset Reference Type Migration"
description = "Riot migrated asset-path fields from string to xxh64 'file' references; string-typed fields no longer load. Converts strings on the migrated (class, field) pairs to file hashes and records hash->path pairs in the BIN trailer. Runs after repath so repathed paths are the ones hashed."
severity = "critical"
phase = "post_repath"

[fixes.file_ref_migration.detect]
type = "class_field_is_string"
targets = [
    { class = "0x13f50786", field = "imagePath" },
    { class = "0x1653d803", field = "IconPath" },
